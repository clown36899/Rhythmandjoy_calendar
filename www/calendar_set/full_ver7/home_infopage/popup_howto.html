<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>리듬앤조이 연습실 – 네이버 예약 안내</title>
  <style>
    <style>.container {
      max-width: 850px !important;
      padding: 25px !important;
    }

    .how-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 30px;
      align-items: center;
      text-align: left;
    }

    .how-left {
      text-align: center;
      border-right: 1px solid #444;
      padding-right: 20px;
    }

    .how-right {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .info-box {
      margin: 0 !important;
      padding: 15px !important;
    }

    .icon-lock {
      display: none;
    }

    h1 {
      margin: 0 0 15px 0 !important;
      font-size: 1.5rem !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <button type="button" id="xxx_btn" onclick="closePopup()">x</button>

    <div class="how-grid">
      <div class="how-left">
        <!-- 아이콘 생략 -->
        <h1>예약은 네이버로 승인없이!</h1>
        <p style="margin-top: 15px; color: #ccc; font-size: 0.95rem;">
          네이버 로그인과 결제 정보는<br>
          <strong>최초 1회만 입력</strong>하면 되며,<br>
          이후엔 더 빠르고 편리하게 예약할 수 있어요!
        </p>
      </div>

      <div class="how-right">
        <div class="info-box">
          <p class="info-main" style="font-size: 1.2rem; margin-bottom: 20px;">
            <strong>1. 네이버에서</strong><br />
            <strong>"리듬앤조이"</strong>를 검색해 예약하세요.
          </p>

          <div class="info-sub">
            <p style="font-size: 1rem;">✨ 사용 1분 전까지도 실시간 예약 가능!</p>
            <p style="font-size: 1rem;">⚡ 네이버 예약 즉시 확정 – 승인 없이 바로 이용 가능</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
