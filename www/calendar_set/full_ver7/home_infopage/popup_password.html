<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>비밀번호 예약 안내</title>
  <link href="home_infopage/popup.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">
    <button type="button" id="xxx_btn" onclick="closePopup()">x</button>
    <h1>비번확인, 예약취소</h1>
    <div style="text-align: center; margin: 20px 0;">
      <style>
        .guide-image {
          max-width: 100%;
          height: auto;
          border-radius: 10px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 768px) {
          .guide-image {
            max-height: 50vh;
            /* 데스크탑에서 스크롤 방지를 위해 높이 제한 */
            width: auto;
            /* 높이에 맞게 너비 자동 조절 */
          }
        }
      </style>
      <img class="guide-image" src="home_infopage/images/naver_booking_guide.jpg" alt="네이버 예약 확인 방법">
    </div>

    <p style="text-align: center; margin-top: 30px; color: #666; font-size: 0.9rem;">
      네이버 예약서비스를 기준으로 운영하고 있습니다.
    </p>
  </div>
</body>

</html>
