  <script>// ⭐ [새 함수: 월간 뷰 width 적용 로직 - datesRender와 resize 이벤트에서 모두 사용] ⭐
    // ⭐ [새 함수: 월간 뷰 width 적용 로직 - datesRender와 resize 이벤트에서 모두 사용] ⭐
    function applyMonthViewWidth() {
      return; // 미사용 함수 - MutationObserver 루프 방지
      // 캘린더 인스턴스가 존재하고 뷰 정보가 있는지 확인
      if (typeof calendar === 'undefined' || !calendar || !calendar.view) {
        return;
      }

      const currentView = calendar.view;
      const DESKTOP_THRESHOLD = 1000;
      const isLargeScreen = window.innerWidth > DESKTOP_THRESHOLD; // 1000px 초과인지 확인



      // 💡 수정된 선택자: FullCalendar 루트 요소(.fc)를 직접 타겟팅합니다.
      // SwipeCalendar는 여러 개의 .fc 요소를 생성할 수 있습니다.
      const tbodyEls = document.querySelectorAll("#calendarAll .fc");

      // 선택된 요소의 개수를 확인합니다.
      console.log(`⭐ 발견된 캘린더 루트 요소(.fc) 개수: ${tbodyEls.length}개`);

      // 만약 .fc가 없다면 구버전 호환성을 위해 .fc-view-harness도 찾아봅니다.
      if (tbodyEls.length === 0) {
        const harnessEls = document.querySelectorAll("#calendarAll .fc-view-harness");
        console.log(`⭐ .fc 없음, .fc-view-harness 시도: ${harnessEls.length}개`);
        // (여기서 harnessEls를 사용하도록 로직을 확장할 수도 있지만, 보통 .fc는 반드시 존재함)
      }
      viewContainers.forEach((containerEl, index) => {
        // 스타일 초기화
        let newWidth = '';
        let marginLeft = '';
        let marginRight = '';
        let logMessage = '';

        if (currentView.type === 'dayGridMonth') {
          if (isLargeScreen) {
            // 🟢 월간 뷰 AND 1000px 초과일 때 33.3% 적용
            // 컨테이너 너비를 강제로 줄임
            newWidth = '33.3%';
            marginLeft = 'auto'; // 가운데 정렬
            marginRight = 'auto';
            logMessage = `✅ 월간 뷰 (1000px 초과): 33.3% 적용 (margin: auto)`;
          } else {
            // 🟡 월간 뷰 AND 1000px 이하일 때 초기화
            newWidth = '';
            marginLeft = '';
            marginRight = '';
            logMessage = `✅ 월간 뷰 (1000px 이하): 초기화 (100%)`;
          }
        } else if (currentView.type === 'timeGridWeek') {
          // 🔵 주간 뷰일 때는 항상 초기화
          newWidth = '';
          marginLeft = '';
          marginRight = '';
          logMessage = `✅ 주간 뷰: 초기화 (100%)`;
        }

        // 스타일 적용 (중요!)
        // 기존 스타일을 덮어쓰기 위해 style 속성 직접 제어
        containerEl.style.setProperty('width', newWidth, 'important');
        containerEl.style.setProperty('margin-left', marginLeft, 'important');
        containerEl.style.setProperty('margin-right', marginRight, 'important');

        // 내부 테이블에도 영향이 가도록 overflow 설정
        containerEl.style.overflow = 'hidden';

        if (logMessage) {
          console.log(`[${index + 1}번째 슬라이드] ${logMessage}`);
        }
      });

      console.log(`⭐ 최종 적용 폭: ${window.innerWidth}px`);
    }


    // ⭐ [디바운스 함수 정의] ⭐
    function debounce(func, timeout = 100) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => { func.apply(this, args); }, timeout);
      };
    }


    // ⭐ [리사이즈 핸들러: 캘린더 업데이트 및 스타일 적용] ⭐
    const handleResizeLog = debounce(() => {
      const currentWidth = window.innerWidth;
      // console.log(`↔️ 리사이즈 감지 (Debounce): Width = ${currentWidth}px`);

      if (typeof calendar !== 'undefined' && calendar && typeof calendar.render === 'function') {
        // 1. FullCalendar 자체 렌더링/리사이즈 메서드 호출
        calendar.render();

        // 2. 렌더링 후 스타일 적용 함수 호출 (지연 없이 즉시 호출)
        applyMonthViewWidth();
      }
    }, 100); // 100ms 동안 리사이즈 멈춘 후 실행

    window.addEventListener('resize', handleResizeLog);

    console.log("✅ 리사이즈 감지 및 스타일 통합 리스너 등록 완료");
  </script>

<script>
  var Target = document.getElementById("clock");
  function clock() {
    var time = new Date();

    var month = time.getMonth();
    var date = time.getDate();
    var day = time.getDay();
    var week = ["일", "월", "화", "수", "목", "금", "토"];

    var hours = time.getHours();
    var minutes = time.getMinutes();
    var seconds = time.getSeconds();

    Target.innerText =
      `${month + 1}월 ${date}일 ${week[day]}요일 ` +
      `${hours < 10 ? `0${hours}` : hours}:${minutes < 10 ? `0${minutes}` : minutes}:${seconds < 10 ? `0${seconds}` : seconds}`;
  }
  clock();
  setInterval(clock, 1000); // 1초마다 실행
</script>

        .writeText(copyTxt.value)
        .then(() => {
          alert("010-4801-7180 복사되었습니다.");
          copyTxt.blur(); // 포커스를 제거하여 선택 해제
        })
        .catch((err) => {
          console.error("복사 실패:", err);
          alert("복사에 실패했습니다.");
        });
    } else {
      // 클립보드 API가 지원되지 않는 경우 execCommand 사용
      try {
        document.execCommand("copy");
        alert("010-4801-7180 복사되었습니다.");
        copyTxt.blur(); // 포커스를 제거하여 선택 해제
      } catch (err) {
        console.error("복사 실패:", err);
        alert("복사에 실패했습니다. 수동으로 복사해주세요.");
      }
    }
  }
</script>

<script>
  // [Ported from V8] 예약정보 버튼 및 오버레이 로직
  function setupInfoButton() {
    const infoBtn = document.getElementById("infoBtn");
    if (infoBtn) {
      infoBtn.setAttribute("aria-expanded", "false");
      infoBtn.addEventListener("click", () => {
        openInfoPage();
      });
    }

    document.querySelectorAll("[data-info-close]").forEach((closeTrigger) => {
      closeTrigger.addEventListener("click", closeInfoPage);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeInfoPage();
      }
    });
  }

  function openInfoPage() {
    const overlay = document.getElementById("infoPageOverlay");
    if (overlay) {
      requestAnimationFrame(() => {
        overlay.classList.add("active");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("info-page-open");
        const infoBtn = document.getElementById("infoBtn");
        if (infoBtn) {
          infoBtn.setAttribute("aria-expanded", "true");
        }
      });
    }
  }

  function closeInfoPage() {
    const overlay = document.getElementById("infoPageOverlay");
    if (overlay) {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("info-page-open");
      const infoBtn = document.getElementById("infoBtn");
      if (infoBtn) {
        infoBtn.setAttribute("aria-expanded", "false");
      }
    }
  }

  // 메시지 리스너 (iframe에서 닫기 요청 시)
  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "closeInfo") {
      closeInfoPage();
    }
  });

  // 초기화
  document.addEventListener('DOMContentLoaded', () => {
    setupInfoButton();

    // 공유 링크로 접근 시 정보창 자동 열기
    const params = new URLSearchParams(window.location.search);
    if (params.get('openInfo') === 'true') {
      const section = params.get('section');
      openInfoPage();
      if (section) {
        // iframe 로드 후 섹션 이동
        const iframe = document.getElementById('infoPageFrame');
        if (iframe) {
          iframe.addEventListener('load', () => {
            iframe.contentWindow.postMessage({ type: 'showSection', section }, '*');
          }, { once: true });
        }
      }
    }
  });
</script>
