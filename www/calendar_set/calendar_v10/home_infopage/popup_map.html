<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>오시는 길 & 주차 안내</title>
  <link href="/calendar_set/calendar_v10/home_infopage/popup.css" rel="stylesheet" type="text/css" />
</head>

<script>
  function copyLink2(button) {
    const address = "서울시 동작구 남부순환로 2077";
    navigator.clipboard.writeText(address).then(() => {
      button.textContent = "✓ 복사됨";
      setTimeout(() => {
        button.textContent = "복사";
      }, 2000);
    });
  }
</script>
<style>
  .container {
    max-width: 850px !important;
    padding: 20px !important;
  }

  .map-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-top: 10px;
    text-align: left;
  }

  .map-left {
    border-right: 1px solid #444;
    padding-right: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .map-right {
    padding-left: 10px;
  }

  .map-header {
    text-align: center;
    margin-bottom: 10px;
  }

  .icon-lock {
    display: none;
  }

  h1 {
    margin: 10px 0 10px 0 !important;
    font-size: 1.5rem !important;
  }

  h3 {
    margin-top: 0 !important;
    margin-bottom: 10px !important;
  }

  .address-box {
    margin: 10px 0 !important;
    padding: 12px !important;
  }

  .info-box {
    margin-top: 15px !important;
    padding: 12px !important;
  }

  .parking-list li {
    margin-bottom: 5px !important;
    font-size: 0.95rem;
  }
</style>
</head>

<body>
  <div class="container">
    <button type="button" id="xxx_btn" onclick="closePopup()">x</button>

    <div class="map-header">
      <!-- 아이콘 생략 -->
      <h1>오시는 길 & 주차 안내</h1>
    </div>

    <div class="map-grid">
      <!-- 왼쪽: 위치 정보 -->
      <div class="map-left">
        <p style="font-size: 1.1rem; font-weight: 600; color: #00A859; text-align: center; margin-bottom: 20px;">
          📌 사당역 7번출구 도보 1분
        </p>

        <div class="address-box">
          <p>
            🏢 <strong>주소:</strong> 서울시 동작구 남부순환로 2077,
            <strong style="color: #ff6b6b; display: inline;">지하 2층</strong>
            <button class="copy-button" onclick="copyLink2(this)">복사</button>
          </p>
        </div>

        <p style="margin-top: 20px; text-align: center;">
          📌 <strong>건물 정보:</strong><br />
          드림디포 문구점 건물 지하
        </p>

        <div class="info-box" style="margin-top: 20px;">
          📞 <strong>예약 외 방문 시:</strong><br>반드시 사전 문의 부탁드립니다.
        </div>
      </div>

      <!-- 오른쪽: 주차 정보 -->
      <div class="map-right">
        <h3>🚗 주차 안내</h3>
        <ul class="parking-list">
          <li style="color: #ff8a80;">
            <strong>기본적으로 제공 불가</strong><br />
            (문구점 퇴근 후 앞 공간 한정 주차 가능)
          </li>
          <li><strong>권장:</strong> "사당역 공영주차장" 이용</li>
          <li>
            <span class="emphasis">⛔ 지하주차 리프트 사용 불가</span>
          </li>
          <li>
            <span class="emphasis">⛔ 건물 앞 좌측 주차라인 사용 불가</span>
          </li>
          <li>
            <span class="emphasis">🚫 카리프트 앞 절대 주차 금지!</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>

</html>
