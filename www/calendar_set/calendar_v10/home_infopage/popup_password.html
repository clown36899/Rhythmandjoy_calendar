<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>비밀번호 예약 안내</title>
  <link href="/calendar_set/calendar_v10/home_infopage/popup.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">
    <button type="button" id="xxx_btn" onclick="closePopup()">x</button>
    <h1>비번확인, 예약취소</h1>
    <div style="text-align: center; margin: 20px 0;">
      <style>
        .guide-image {
          max-width: 100%;
          height: auto;
          border-radius: 10px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 768px) {
          .guide-image {
            max-height: 50vh;
            /* 데스크탑에서 스크롤 방지를 위해 높이 제한 */
            width: auto;
            /* 높이에 맞게 너비 자동 조절 */
          }
        }

        .naver-guide-actions {
          display: grid;
          gap: 8px;
          max-width: 420px;
          margin: 18px auto 0;
        }

        .naver-guide-button {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 46px;
          padding: 12px 14px;
          border-radius: 8px;
          background: #03C75A;
          color: #ffffff !important;
          text-decoration: none;
          font-weight: 700;
        }

        .naver-guide-note {
          margin: 12px auto 0;
          max-width: 420px;
          padding: 12px;
          border-radius: 8px;
          background: #f5f7f6;
          color: #333333;
          font-size: 0.92rem;
          line-height: 1.5;
          text-align: left;
        }

        .my-label {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          min-width: 34px;
          padding: 1px 7px 2px;
          border-radius: 999px;
          background: #111111;
          color: #ffffff;
          font-size: 0.78rem;
          font-weight: 800;
        }
      </style>
      <img class="guide-image" src="/calendar_set/calendar_v10/home_infopage/images/naver_booking_guide.jpg" alt="네이버 예약 확인 방법">
      <div class="naver-guide-actions">
        <a class="naver-guide-button" href="https://booking.naver.com/booking/10/bizes/1257912" target="_blank" rel="noopener">네이버 예약 페이지 열기</a>
      </div>
      <p class="naver-guide-note">
        예약정보, 비밀번호, 취소 확인은 네이버 예약 페이지 오른쪽 위 <span class="my-label">MY</span> 메뉴에서 확인할 수 있습니다. 네이버 로그인이 필요합니다.
      </p>
    </div>

    <p style="text-align: center; margin-top: 30px; color: #666; font-size: 0.9rem;">
      네이버 예약서비스를 기준으로 운영하고 있습니다.
    </p>
  </div>
</body>

</html>
