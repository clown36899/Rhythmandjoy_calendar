<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>시설안내</title>
  <style>
    /* 데스크탑 전용 넓은 레이아웃 (Compact) */
    .container {
      max-width: 900px !important;
      padding: 20px !important;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 20px;
      margin-top: 10px;
      text-align: left;
    }

    .col-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 15px;
      border-right: 1px solid #444;
      justify-content: center;
    }

    .col-right {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .col-right .info-item:nth-child(1) {
      grid-column: span 2;
    }

    /* TV는 길어서 span 2 */

    .info-item {
      background: #333;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
    }

    .info-item strong {
      display: block;
      margin-bottom: 5px;
      color: #00A859;
      font-size: 1.05em;
    }

    .room-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
    }

    .room-buttons button {
      width: 100%;
      padding: 10px;
      margin: 0 !important;
      font-size: 0.9em !important;
    }

    .full-width-btn {
      grid-column: span 3;
      background-color: #00bcd4 !important;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px 0 !important;
      font-size: 1.4rem !important;
    }

    .icon-lock {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <button type="button" id="xxx_btn" onclick="closePopup()">x</button>

    <div style="text-align: center; margin-bottom: 10px;">
      <!-- 아이콘 생략 -->
      <h1>리듬앤조이 연습실 시설 안내</h1>
    </div>

    <div class="info-grid">
      <!-- 왼쪽 컬럼: 룸 정보 및 평면도 -->
      <div class="col-left">
        <div class="info-item" style="border: none; background: none; padding: 0;">
          <strong style="color: #fff; font-size: 1.3rem; margin-bottom: 15px;">1. 룸 및 평면도</strong>

          <div class="room-buttons">
            <button class="inline-button full-width-btn"
              onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomALL')">📊 전체 평면도 보기</button>

            <button class="inline-button" onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomA')">A홀
              (10×6m)</button>
            <button class="inline-button" onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomB')">B홀
              (8.4×4.5m)</button>
            <button class="inline-button" onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomE')">E홀
              (6.5×6m)</button>
            <button class="inline-button" onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomC')">C홀
              (4.5×3.5m)</button>
            <button class="inline-button" onclick="openInnerPopup('home_infopage/popup_gallery.html?folder=roomD')">D홀
              (4.5×2.8m)</button>
          </div>
          <p style="margin-top: 15px; color: #ccc; font-size: 0.9em;">
            * 각 버튼을 클릭하면 사진을 볼 수 있습니다.
          </p>
        </div>
      </div>

      <!-- 오른쪽 컬럼: 기타 상세 정보 -->
      <div class="col-right">
        <div class="info-item">
          <strong>2. 📺 대형 TV 완비</strong>
          A홀(55인치), B홀(65인치) 설치<br>
          HDMI / C타입 / 아이폰 8핀 커넥터 제공
        </div>

        <div class="info-item">
          <strong>3. 🧘‍♀️ 댄서 전용 탄성 마루</strong>
          무릎 충격을 흡수하는 최고급 고무 쿠션 바닥 시공
        </div>

        <div class="info-item">
          <strong>4. 📹 보안 시스템</strong>
          CCTV 24시간 녹화 중 (파손 시 원상 복구 책임)
        </div>

        <div class="info-item" style="border-color: #ff8a80;">
          <strong style="color: #ff8a80;">5. ⛔ 주의사항</strong>
          젖은 신발 제습기 건조 필수 / 우산 반입 금지
        </div>
      </div>
    </div>
  </div>
</body>

</html>
