<!DOCTYPE html>
<html>

<head>
    <title>IndexedDB 초기화 & 재동기화</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
        }

        .danger {
            background: #ff4444;
            color: white;
            border: none;
        }

        .success {
            background: #44ff44;
            color: black;
            border: none;
        }

        pre {
            background: white;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>🔧 IndexedDB 초기화 & 재동기화</h1>

    <button class="danger" onclick="clearDB()">1️⃣ IndexedDB 완전 삭제</button>
    <button class="success" onclick="resync()">2️⃣ Google Calendar에서 재동기화</button>

    <h2>결과:</h2>
    <pre id="output">대기 중...</pre>

    <script>
        const output = document.getElementById('output');

        async function clearDB() {
            try {
                output.textContent = 'IndexedDB 삭제 중...';
                await indexedDB.deleteDatabase('RhythmJoyCalendarDB');
                output.textContent = '✅ IndexedDB 완전 삭제 완료!\n\n이제 "2️⃣ Google Calendar에서 재동기화" 버튼을 클릭하세요.';
            } catch (error) {
                output.textContent = '❌ 에러: ' + error.message;
            }
        }

        async function resync() {
            try {
                output.textContent = 'Google Calendar에서 데이터 가져오는 중...\n';

                const now = new Date();
                const start = new Date(now.getFullYear(), now.getMonth(), 1);
                const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);

                const url = `/api/calendar/sync?start=${start.toISOString()}&end=${end.toISOString()}`;

                output.textContent += `📡 API 호출: ${url}\n\n`;

                const response = await fetch(url);
                const data = await response.json();

                output.textContent += `✅ Google Calendar에서 ${data.events.length}개 이벤트 수신!\n\n`;
                output.textContent += `최신 이벤트 3개:\n`;

                data.events.slice(0, 3).forEach((event, i) => {
                    output.textContent += `\n${i + 1}. ${event.title}\n`;
                    output.textContent += `   시작: ${event.start}\n`;
                    output.textContent += `   업데이트: ${event.updated_at}\n`;
                });

                output.textContent += `\n\n✅ 완료! 이제 메인 페이지를 새로고침하세요.`;

            } catch (error) {
                output.textContent = '❌ 에러: ' + error.message;
            }
        }
    </script>
</body>

</html>
