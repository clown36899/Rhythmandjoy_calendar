<!DOCTYPE html>
<html>

<head>
    <title>IndexedDB Quick Check</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>IndexedDB 빠른 확인</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        async function checkDB() {
            try {
                // Open DB
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('RhythmJoyCalendarDB');
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                // Count events
                const tx = db.transaction(['events'], 'readonly');
                const store = tx.objectStore('events');
                const count = await new Promise((resolve, reject) => {
                    const req = store.count();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });

                // Check metadata
                const tx2 = db.transaction(['sync_metadata'], 'readonly');
                const store2 = tx2.objectStore('sync_metadata');
                const metadata = await new Promise((resolve, reject) => {
                    const req = store2.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });

                db.close();

                if (count > 0) {
                    output.innerHTML = `<p class="pass">✅ 성공!</p>
                        <p>이벤트 개수: ${count}</p>
                        <p>동기화 기록: ${metadata.length}개</p>
                        <pre>${JSON.stringify(metadata, null, 2)}</pre>`;
                    document.body.style.backgroundColor = '#e6ffe6';
                } else {
                    output.innerHTML = `<p class="fail">❌ 실패</p>
                        <p>events 스토어가 비어있습니다.</p>
                        <p>브라우저 콘솔에서 에러를 확인하세요.</p>`;
                    document.body.style.backgroundColor = '#ffe6e6';
                }

            } catch (error) {
                output.innerHTML = `<p class="fail">❌ 에러</p><p>${error.message}</p>`;
                document.body.style.backgroundColor = '#ffe6e6';
            }
        }

        // Wait for page load
        setTimeout(checkDB, 3000);
    </script>
</body>

</html>
