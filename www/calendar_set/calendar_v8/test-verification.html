<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>종합 검증 테스트</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }

        .test-section {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        .pending {
            color: orange;
        }

        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>🧪 Direct Proxy Sync 종합 검증</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(msg, status = 'info') {
            const div = document.createElement('div');
            div.className = `test-section ${status}`;
            div.innerHTML = msg;
            results.appendChild(div);
            console.log(msg.replace(/<[^>]*>/g, ''));
        }

        async function runTests() {
            log('<h2>📋 테스트 시작</h2>');

            // Test 1: IndexedDB 초기화
            log('<h3>Test 1: IndexedDB 초기화</h3>', 'pending');
            try {
                const dbs = await indexedDB.databases();
                const calendarDB = dbs.find(db => db.name === 'RhythmJoyCalendarDB');

                if (!calendarDB) {
                    throw new Error('RhythmJoyCalendarDB not found');
                }

                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('RhythmJoyCalendarDB');
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                const storeNames = Array.from(db.objectStoreNames);
                if (!storeNames.includes('events')) throw new Error('events store missing');
                if (!storeNames.includes('sync_metadata')) throw new Error('sync_metadata store missing');

                log(`<span class="pass">✅ PASS</span>: IndexedDB 초기화 성공<br>
                     - DB: ${calendarDB.name} (v${calendarDB.version})<br>
                     - Stores: ${storeNames.join(', ')}`, 'pass');
                db.close();
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Test 2: SyncManager 존재 확인
            log('<h3>Test 2: SyncManager 초기화</h3>', 'pending');
            try {
                if (!window.syncManager) throw new Error('window.syncManager not found');
                if (typeof window.syncManager.syncMonth !== 'function') {
                    throw new Error('syncMonth method missing');
                }
                log(`<span class="pass">✅ PASS</span>: SyncManager 정상 로드`, 'pass');
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Test 3: 데이터 저장 확인
            log('<h3>Test 3: IndexedDB 데이터 저장</h3>', 'pending');
            try {
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('RhythmJoyCalendarDB');
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                const tx = db.transaction(['events'], 'readonly');
                const store = tx.objectStore('events');
                const countRequest = store.count();

                const count = await new Promise((resolve, reject) => {
                    countRequest.onsuccess = () => resolve(countRequest.result);
                    countRequest.onerror = () => reject(countRequest.error);
                });

                if (count === 0) {
                    log(`<span class="fail">⚠️ WARNING</span>: events 스토어가 비어있습니다. syncMonth()를 호출하세요.`, 'fail');
                } else {
                    log(`<span class="pass">✅ PASS</span>: ${count}개 이벤트 저장됨`, 'pass');
                }
                db.close();
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Test 4: TTL 메타데이터 확인
            log('<h3>Test 4: TTL 메타데이터</h3>', 'pending');
            try {
                const db = await new Promise((resolve, reject) => {
                    const request = indexedDB.open('RhythmJoyCalendarDB');
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                const tx = db.transaction(['sync_metadata'], 'readonly');
                const store = tx.objectStore('sync_metadata');
                const allRequest = store.getAll();

                const metadata = await new Promise((resolve, reject) => {
                    allRequest.onsuccess = () => resolve(allRequest.result);
                    allRequest.onerror = () => reject(allRequest.error);
                });

                if (metadata.length === 0) {
                    log(`<span class="fail">⚠️ WARNING</span>: sync_metadata가 비어있습니다.`, 'fail');
                } else {
                    const metaInfo = metadata.map(m => `${m.key}: ${new Date(m.lastSyncedAt).toLocaleString()}`).join('<br>');
                    log(`<span class="pass">✅ PASS</span>: TTL 기록 존재<br>${metaInfo}`, 'pass');
                }
                db.close();
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Test 5: API 엔드포인트 확인
            log('<h3>Test 5: API 엔드포인트</h3>', 'pending');
            try {
                const now = new Date();
                const start = new Date(now.getFullYear(), now.getMonth(), 1);
                const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);

                const url = `/api/calendar/sync?start=${start.toISOString()}&end=${end.toISOString()}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                if (!data.events) throw new Error('events 필드 없음');

                log(`<span class="pass">✅ PASS</span>: API 응답 성공 (${data.events.length}개 이벤트)`, 'pass');
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Test 6: syncMonth 실행 테스트
            log('<h3>Test 6: syncMonth() 실행</h3>', 'pending');
            try {
                const now = new Date();
                await window.syncManager.syncMonth(now.getFullYear(), now.getMonth(), true);
                log(`<span class="pass">✅ PASS</span>: syncMonth() 실행 성공`, 'pass');
            } catch (error) {
                log(`<span class="fail">❌ FAIL</span>: ${error.message}`, 'fail');
            }

            // Final Summary
            log('<h2>📊 테스트 완료</h2>');
            const passCount = document.querySelectorAll('.pass').length;
            const failCount = document.querySelectorAll('.fail').length;
            log(`<strong>통과: ${passCount} / 실패: ${failCount}</strong>`);
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            setTimeout(runTests, 2000); // Wait for app initialization
        });
    </script>
</body>

</html>
