<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Calendar Integration Test</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App Scripts (Order Matters) -->
    <script src="./js/config.js"></script>
    <script src="./js/cacheRules.js"></script>
    <script src="./js/indexed-db-manager.js"></script>
    <script src="./js/sync-manager.js"></script>
    <script src="./js/calendar-core.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="./css/calendar.css" />
</head>

<body>
    <div id="test-output" style="padding: 20px; background: #f0f0f0; border-bottom: 1px solid #ccc;">
        <h3>🧪 Integration Test Status</h3>
        <div id="log-container"></div>
    </div>

    <!-- Calendar Container -->
    <div class="app-container" style="height: 500px; position: relative;">
        <header class="calendar-header">
            <h1 id="calendarTitle">Title</h1>
        </header>
        <main id="calendarContainer" style="height: 400px; overflow: hidden;">
            <div class="calendar-slider">
                <div class="calendar-slide"></div>
                <div class="calendar-slide"></div>
                <div class="calendar-slide"></div>
            </div>
        </main>

        <!-- Dummy Controls -->
        <button id="prevWeekBtn" style="display:none"></button>
        <button id="nextWeekBtn" style="display:none"></button>
        <button id="todayBtn" style="display:none"></button>
        <button id="allRoomsBtn" style="display:none"></button>
        <div class="room-btn" data-room="a" style="display:none"></div>
    </div>

    <script>
        // 1. Setup Logger
        const logContainer = document.getElementById('log-container');
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = `[${type.toUpperCase()}] ${msg}`;
            div.style.color = type === 'error' ? 'red' : (type === 'success' ? 'green' : 'black');
            logContainer.appendChild(div);
            console.log(msg);
        }

        // 2. Mocks
        window._originalConsole = console;

        // Mock Supabase
        const mockSupabase = {
            channel: () => ({
                on: () => ({ subscribe: (cb) => { if (cb) cb('SUBSCRIBED'); } }),
                removeChannel: () => { }
            }),
            removeChannel: () => { }
        };

        // Mock Fetch (Proxy)
        window.fetch = async (url) => {
            log(`🌐 [Network] Fetch requested: ${url}`, 'info');
            return {
                ok: true,
                json: async () => ({
                    events: [
                        { id: 'evt-1', title: 'Integration Event', start: '2025-01-15T10:00:00', end: '2025-01-15T12:00:00', roomId: 'a' }
                    ]
                })
            };
        };

        // 3. Run Test
        async function runIntegrationTest() {
            try {
                log('🚀 Starting Integration Test...', 'info');

                // A. Initialize Managers
                const dbManager = new IndexedDBManager();
                await dbManager.init();
                log('✅ IndexedDB Initialized', 'success');

                const syncManager = new SyncManager(dbManager, mockSupabase);
                await syncManager.init();
                window.syncManager = syncManager; // Expose globally for Calendar
                log('✅ SyncManager Initialized', 'success');

                // B. Initialize Calendar
                const calendar = new Calendar('calendarContainer');
                window.calendar = calendar;

                // Mock render to track calls
                const originalRender = calendar.render.bind(calendar);
                let renderCount = 0;
                calendar.render = async () => {
                    renderCount++;
                    log(`🎨 Calendar Render Called (${renderCount})`, 'info');
                    return originalRender();
                };

                calendar.setupEventListeners();
                log('✅ Calendar Initialized', 'success');

                // C. Test Flow: Navigate -> Sync -> Render
                log('👉 Action: Navigate to 2025-01', 'info');

                // Manually trigger sync for test month
                await syncManager.syncMonth(2025, 0, true); // Force sync

                // Verify DB has data
                const events = await dbManager.getEvents(new Date('2025-01-01'), new Date('2025-02-01'));
                if (events.length > 0 && events[0].title === 'Integration Event') {
                    log(`✅ DB Verified: Found ${events.length} events`, 'success');
                } else {
                    throw new Error('DB missing expected events');
                }

                // D. Test Flow: Realtime Update
                log('👉 Action: Simulate Realtime Event', 'info');
                await syncManager.handleRealtimeEvent({ room_id: 'a', timestamp: new Date().toISOString() });

                // Wait for render (triggered by calendar-data-changed)
                await new Promise(r => setTimeout(r, 500));

                if (renderCount > 0) {
                    log('🎉 Integration Test Passed!', 'success');
                    document.body.style.backgroundColor = '#e6fffa';
                } else {
                    throw new Error('Calendar did not render after updates');
                }

            } catch (error) {
                log(`❌ Test Failed: ${error.message}`, 'error');
                console.error(error);
                document.body.style.backgroundColor = '#ffe6e6';
            }
        }

        // Start
        window.addEventListener('load', runIntegrationTest);
    </script>
</body>

</html>
