  <!-- URL 정규화: index.html이 포함된 경우 디렉토리 경로로 리디렉션 -->
  <script>
    (function () {
      var currentPath = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // URL에 index.html이 포함되어 있는지 확인
      if (currentPath.endsWith('/index.html')) {
        // index.html 제거한 디렉토리 경로 생성
        var newPath = currentPath.replace('/index.html', '/');
        var newUrl = newPath + search + hash;

        // 리디렉션 (replace 사용으로 브라우저 히스토리에 중복 기록 방지)
        window.location.replace(newUrl);
      }
    })();
  </script>

  <script>
    // 🔧 [설정] 로그 출력 여부 (true: 켜기, false: 끄기)
    window.ENABLE_LOGS = true;

    // 원본 console 메서드 보관
    const originalLog = console.log.bind(console);
    const originalInfo = console.info.bind(console);
    const originalWarn = console.warn.bind(console);
    const originalError = console.error.bind(console);
    const originalTable = console.table ? console.table.bind(console) : originalLog;

    // 로그 제어 함수
    const conditionalLog = (...args) => { if (window.ENABLE_LOGS) originalLog(...args); };
    const conditionalInfo = (...args) => { if (window.ENABLE_LOGS) originalInfo(...args); };

    // 1. window._originalConsole 재정의 (코드에서 사용하는 것)
    window._originalConsole = {
      log: conditionalLog,
      info: conditionalInfo,
      warn: originalWarn,   // 경고는 항상 출력 (필요시 변경 가능)
      error: originalError, // 에러는 항상 출력
      table: originalTable
    };

    // 2. 전역 console.log 덮어쓰기 (라이브러리 및 기타 코드용)
    console.log = conditionalLog;
    console.info = conditionalInfo;
    // console.warn, console.error는 유지

    // 💡 [신규] 강제 로그 출력용 (설정과 무관하게 항상 출력)
    window.FORCE_LOG = originalLog;
  </script>

  <script>
    // 연락처 복사 함수
    function copy() {
      var copyTxt = document.getElementById("copyTxt");
      copyTxt.select();
      copyTxt.setSelectionRange(0, 99999);

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard
          .writeText(copyTxt.value)
          .then(() => {
            alert("010-4801-7180 복사되었습니다.");
            copyTxt.blur();
          })
          .catch((err) => {
            window._originalConsole.error("복사 실패", err);
            alert("복사에 실패했습니다.");
          });
      } else {
        try {
          document.execCommand("copy");
          alert("010-4801-7180 복사되었습니다.");
          copyTxt.blur();
        } catch (err) {
          window._originalConsole.error("복사 실패", err);
          alert("복사에 실패했습니다. 수동으로 복사해주세요.");
        }
      }
    }
  </script>
