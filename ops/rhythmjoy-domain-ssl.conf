<VirtualHost *:443>
    ServerName xn--xy1b23ggrmm5bfb82ees967e.com
    ServerAlias www.xn--xy1b23ggrmm5bfb82ees967e.com
    ServerAlias xn--ok1bu3xyqbnfk8l.com www.xn--ok1bu3xyqbnfk8l.com
    DocumentRoot "/home/clown313python/myapp"

    ErrorLog logs/rhythmjoy_ssl_error_log
    CustomLog logs/rhythmjoy_ssl_access_log combined
    LogLevel warn

    SSLEngine on
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:3DES:!aNULL:!MD5:!SEED:!IDEA
    SSLCertificateFile /etc/letsencrypt/live/xn--xy1b23ggrmm5bfb82ees967e.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xn--xy1b23ggrmm5bfb82ees967e.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/xn--xy1b23ggrmm5bfb82ees967e.com/chain.pem

    RewriteEngine On
    # Consolidate this domain only; the shared DocumentRoot serves other businesses.
    RewriteCond %{HTTP_HOST} ^(?:www\.xn--xy1b23ggrmm5bfb82ees967e\.com|(?:www\.)?xn--ok1bu3xyqbnfk8l\.com)(?::443)?$ [NC]
    RewriteRule ^/(.*)$ https://xn--xy1b23ggrmm5bfb82ees967e.com/$1 [R=301,L]
    RewriteRule ^/calendar_set/(calendar_v8|calendar_v9|full_ver7)(/.*)?$ /calendar_set/calendar_v10/calendar_10.html [R=301,L]
    # Redirect externally requested generated HTML, never our internal rewrites or assets.
    RewriteCond %{THE_REQUEST} \s/+calendar_set/calendar_v10/site/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^/calendar_set/calendar_v10/site/(.*)index\.html$ /$1 [R=301,L]
    RewriteRule ^/calendar_set/calendar_v10/site/?$ / [R=301,L]
    RewriteCond %{THE_REQUEST} \s/+calendar_set/calendar_v10/site/
    RewriteCond %{DOCUMENT_ROOT}/calendar_set/calendar_v10/site/$1/index.html -f
    RewriteRule ^/calendar_set/calendar_v10/site/(.+?)/?$ /$1/ [R=301,L]
    # Clean public /index.html variants use the same route/file owner as the homepage.
    RewriteCond %{THE_REQUEST} \s/+[^?\s]*index\.html(?:[?\s]|$)
    RewriteCond /home/clown313python/myapp/calendar_set/calendar_v10/site/$1index.html -f
    RewriteRule ^/((?!calendar_set/).*)index\.html$ /$1 [R=301,L]
    # Public website is generated by site-preview/build.py. Calendar URLs remain unchanged.
    RewriteRule ^/(?:index\.html)?$ /calendar_set/calendar_v10/site/index.html [L]
    RewriteCond %{REQUEST_URI} !^/calendar_set/
    RewriteCond /home/clown313python/myapp/calendar_set/calendar_v10/site%{REQUEST_URI}/index.html -f
    RewriteRule ^/(.+[^/])$ /$1/ [R=301,L]
    RewriteCond %{REQUEST_URI} !^/calendar_set/
    RewriteCond /home/clown313python/myapp/calendar_set/calendar_v10/site%{REQUEST_URI}index.html -f
    RewriteRule ^/(.+)/$ /calendar_set/calendar_v10/site/$1/index.html [L]
    RewriteCond %{REQUEST_URI} !^/calendar_set/
    RewriteCond /home/clown313python/myapp/calendar_set/calendar_v10/site%{REQUEST_URI} -f
    RewriteRule ^/(.+)$ /calendar_set/calendar_v10/site/$1 [L]

    <Directory "/home/clown313python/myapp">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
