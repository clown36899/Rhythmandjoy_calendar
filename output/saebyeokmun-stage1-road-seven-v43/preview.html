&lt;script&gt;(() =&gt; {

  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */

    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

  const openExternal = ({ href }) =&gt; {

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||

        pendingStateWrites.delete(id);

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }

      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;script&gt;
(()=&gt;{
 const root=document.getElementById(&#x27;stone-road-loop-v43&#x27;);
 const canvas=root.querySelector(&#x27;canvas&#x27;),ctx=canvas.getContext(&#x27;2d&#x27;);
 const source=root.querySelector(&#x27;[data-road-source]&#x27;);
 const play=root.querySelector(&#x27;[data-road-action=&quot;play&quot;]&#x27;);
 const seam=root.querySelector(&#x27;[data-road-action=&quot;seam&quot;]&#x27;);
 const all=root.querySelector(&#x27;[data-road-action=&quot;all&quot;]&#x27;);
 const status=root.querySelector(&#x27;[data-road-status]&#x27;);
 const reduced=window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
 const saved=window.openai?.widgetState?.privateContent;
 let mode=saved?.mode===&#x27;all&#x27;?&#x27;all&#x27;:&#x27;seam&#x27;,playing=false,offset=0,last=0,frame=0,ready=false;
 const W=2097,H=224,Y=304,cuts=[0,299,599,898,1198,1497,1797,2097];
 function save(){window.openai?.setWidgetState?.({modelContent:{roadTiles:7,view:mode},privateContent:{mode}})?.catch(()=&gt;{});}
 function buttons(){play.textContent=playing?&#x27;일시정지&#x27;:&#x27;반복 재생&#x27;;play.setAttribute(&#x27;aria-pressed&#x27;,String(playing));seam.setAttribute(&#x27;aria-pressed&#x27;,String(mode===&#x27;seam&#x27;));all.setAttribute(&#x27;aria-pressed&#x27;,String(mode===&#x27;all&#x27;));}
 function draw(){
  if(!ready)return;
  const width=Math.max(1,root.getBoundingClientRect().width);
  const scale=mode===&#x27;all&#x27;?width/W:Math.max(1,width/640);
  const height=Math.ceil(H*scale+36),dpr=Math.min(window.devicePixelRatio||1,2);
  if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(height*dpr)){canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);canvas.style.height=height+&#x27;px&#x27;;}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const color=getComputedStyle(root).getPropertyValue(&#x27;--foreground&#x27;).trim()||getComputedStyle(root).color;
  ctx.fillStyle=color;ctx.font=&#x27;12px system-ui&#x27;;ctx.textAlign=&#x27;center&#x27;;
  if(mode===&#x27;all&#x27;){
   ctx.drawImage(source,0,Y,W,H,0,26,W*scale,H*scale);
   cuts.slice(0,-1).forEach((x,i)=&gt;ctx.fillText(String(i+1),(x+cuts[i+1])*scale/2,16));
  }else{
   const start=(W-width/(2*scale)+offset)%W;
   for(let i=-1;i&lt;3;i++)ctx.drawImage(source,0,Y,W,H,(i*W-start)*scale,26,W*scale,H*scale);
   if(!playing&amp;&amp;offset===0){
    ctx.fillText(&#x27;7&#x27;,width/2-36,16);ctx.fillText(&#x27;1&#x27;,width/2+36,16);
    ctx.strokeStyle=getComputedStyle(root).getPropertyValue(&#x27;--border&#x27;).trim()||color;
    ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(width/2,26);ctx.lineTo(width/2,height);ctx.stroke();
   }
  }
 }
 function tick(now){if(!playing)return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;offset=(offset+dt*75)%W;draw();frame=requestAnimationFrame(tick);}
 function stop(){playing=false;last=0;cancelAnimationFrame(frame);buttons();}
 function select(next){stop();mode=next;offset=0;status.textContent=next===&#x27;all&#x27;?&#x27;1 → 2 → 3 → 4 → 5 → 6 → 7&#x27;:&#x27;7 → 1 연결&#x27;;buttons();draw();save();}
 play.addEventListener(&#x27;click&#x27;,()=&gt;{if(playing){stop();status.textContent=&#x27;반복 일시정지&#x27;;}else{mode=&#x27;seam&#x27;;playing=true;last=0;buttons();status.textContent=&#x27;7구간 반복 재생&#x27;;frame=requestAnimationFrame(tick);}save();});
 seam.addEventListener(&#x27;click&#x27;,()=&gt;select(&#x27;seam&#x27;));all.addEventListener(&#x27;click&#x27;,()=&gt;select(&#x27;all&#x27;));
 reduced.addEventListener(&#x27;change&#x27;,()=&gt;{if(reduced.matches){stop();draw();}});
 window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{const view=event.detail?.globals?.widgetState?.privateContent?.mode;if((view===&#x27;all&#x27;||view===&#x27;seam&#x27;)&amp;&amp;view!==mode){stop();mode=view;offset=0;buttons();draw();}});
 document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{if(document.hidden){stop();draw();}});
 root.addEventListener(&#x27;dragstart&#x27;,event=&gt;event.preventDefault());
 new ResizeObserver(draw).observe(root);
 source.addEventListener(&#x27;load&#x27;,()=&gt;{ready=true;buttons();draw();});
 if(source.complete&amp;&amp;source.naturalWidth){ready=true;buttons();draw();}
})();

      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
